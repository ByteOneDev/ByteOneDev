name: Mise à jour des widgets

on:
  schedule:
    # toutes les 6 heures
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "widgets.config.json"
      - "scripts/build_widgets.py"
      - ".github/workflows/widgets.yml"

permissions:
  contents: write

concurrency:
  group: widgets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer les widgets SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_widgets.py

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets)" ]; then
            git add assets
            git commit -m "chore(widgets): rafraîchit les widgets du profil"
            git push
          else
            echo "Aucun changement."
          fi
