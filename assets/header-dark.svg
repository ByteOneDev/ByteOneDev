<svg xmlns="http://www.w3.org/2000/svg" width="850" height="200" viewBox="0 0 850 200" role="img" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#a371f7"/></linearGradient><pattern id="board" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#58a6ff" opacity="0.08"/><rect x="20" y="20" width="20" height="20" fill="#58a6ff" opacity="0.08"/></pattern></defs><style>
@keyframes fadeUp { from { opacity:0; transform:translateY(6px);} to {opacity:1; transform:translateY(0);} }
@keyframes grow { from { transform:scaleX(0);} to {transform:scaleX(1);} }
@keyframes float { 0%,100% { transform:translateY(0);} 50% { transform:translateY(-5px);} }
.fu { animation: fadeUp .7s ease both; }
.bar { transform-origin: left center; animation: grow 1.1s cubic-bezier(.22,1,.36,1) both; }
text { dominant-baseline: middle; }

    .t1 { font-size: 34px; font-weight: 700; }
    .t2 { font-size: 17px; font-weight: 600; }
    .t3 { font-size: 13px; }
    .pc { font-size: 30px; animation: float 4s ease-in-out infinite; }
