="animation-delay:0.81s"><rect x="340" y="152" width="55" height="26" rx="13" fill="#161b22" stroke="#30363d"/><text x="368" y="166" fill="#8b949e" font-size="12" text-anchor="middle">Échecs</text></g></svg>